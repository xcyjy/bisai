  - type: action
    text: 火车进站时，雨正下得密。沈墨提着一只旧皮箱站在月台上，看着头顶斑驳的站牌。七年了，这座小城的站台还是老样子，连那盏忽明忽暗的灯都没换。
  - type: voiceover
    text: 他没想到自己真的会回来。当年走得那么决绝，连一句道别都没留下。可此刻站在熟悉的雨里，心口还是不争气地发紧。
    character: 沈墨
  - type: dialogue
    text: 沈墨？
    character: 沈墨
  - type: action
    text: 一个女声从身后传来。他回过头，看见林晚撑着一把藏青色的伞，站在出站口。她比记忆里瘦了些，眼神却还是那样，像能把人看穿。
  - type: dialogue
    text: 是我。
    character: 沈墨
  - type: dialogue
    text: 七年。
    character: 林晚
  - type: action
    text: 他点点头，没有说话。雨水顺着伞骨滴下来，在两人之间砸出一小片水花。
  breakdown:
    cast:
    - 沈墨
    - 林晚
