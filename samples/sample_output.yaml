  - type: action
    text: 黄昏，城东的老钟楼。
  - type: action
    text: 夕阳把钟楼的影子拉得很长。沈墨在楼下的石缝里摸索了许久，终于掏出一个铁皮盒子，锈迹斑斑。
  - type: action
    text: 他打开盒子，里面是一沓泛黄的照片，和一块旧怀表。照片上是年轻的父亲，抱着襁褓中的他，笑得灿烂。
  - type: dialogue
    text: 原来你一直都记得。
    character: 沈墨
  - type: dialogue
    text: 找到了？
    character: 林晚
  - type: dialogue
    text: 嗯。
    character: 沈墨
  - type: action
    text: 风穿过钟楼，吹响了那口沉寂多年的铜钟。钟声悠远，像是替这座旧城，也替他自己，敲响了一个迟到太久的回答。
  breakdown:
    cast:
    - 沈墨
    - 林晚
  est_duration_sec: 20
