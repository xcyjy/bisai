  - type: action
    text: 第二天清晨，沈墨独自回到老宅。
  - type: action
    text: 院子里的那棵石榴树还在，只是枯了大半。他推开吱呀作响的木门，屋里满是灰尘的味道。阳光从破了一角的窗纸透进来，照在父亲生前最爱的那把藤椅上。
  - type: voiceover
    text: 他忽然想起小时候，父亲就是坐在那把椅子上，一遍遍给他讲城里的旧事。那时候他总觉得啰嗦，现在却宁愿再听一万遍。
    character: 沈墨
  - type: action
    text: 桌上压着一封没有寄出的信，信封上是父亲的字迹：致墨儿。
  - type: action
    text: 沈墨的手抖了一下。他拆开信，里面只有短短一行：城东的老钟楼下，我替你留了样东西。
  - type: dialogue
    text: 留了什么……
    character: 林晚
  breakdown:
